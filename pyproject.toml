[project]
name = "jev-tree-memory"
version = "0.1.0"
description = "Controlled LongMemEval comparison of global retrieval and Jev-directed n-ary tree retrieval"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "sentence-transformers>=6.0",
  "onnxruntime>=1.18",
  "truststore>=0.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
